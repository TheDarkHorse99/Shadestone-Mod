# Runs when a release is published on GitHub (Releases > Draft a new release).
# Builds the mod and attaches umbral-world-<version>.jar to that release.
# If .github/release-notes/<tag>.md exists (e.g. v0.1.0.md), it becomes the
# release's description.
# The tag must be `version=` from gradle.properties with a "v" in front.

name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: attach the jar (and notes) to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          JAR="build/libs/umbral-world-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected $JAR. Does version= in gradle.properties match the tag $TAG?"
            ls build/libs
            exit 1
          fi
          gh release upload "$TAG" "$JAR" --clobber
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$TAG" --notes-file "$NOTES"
          fi
